<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude-like Chat UI</title>
  <style>
    /* 5. MATERIAL 3 TOKENS (Define these CSS variables globally) */
    :root {
      /* Light theme (default) */
      --md-sys-color-surface: #f7f7f8;        /* Claude's soft gray background */
      --md-sys-color-surface-container-low: #f0f0f2;
      --md-sys-color-surface-container-high: #e8e8ea;
      --md-sys-color-surface-container-highest: #d9d9dc;
      --md-sys-color-primary: #7c3aed;         /* Vibrant purple (Claude-like) */
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-on-surface: #1a1a1a;
      --md-sys-color-on-surface-variant: #6e6e73;

      /* Elevations (Box-shadows, no borders) */
      --md-elevation-1: 0px 1px 2px rgba(0,0,0,0.05);
      --md-elevation-2: 0px 2px 8px rgba(0,0,0,0.06);
      --md-elevation-4: 0px 4px 20px rgba(0,0,0,0.08);
      --md-elevation-6: 0px 6px 30px rgba(0,0,0,0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
      /* 1. LAYOUT ARCHITECTURE */
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      overflow: hidden;
    }

    /* 2. TOP BAR SPECIFICATIONS */
    .top-bar {
      height: 72px;
      padding: 0 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: transparent;
      flex-shrink: 0;
    }

    .greeting {
      font-weight: 700;
      font-size: 28px;
      color: var(--md-sys-color-on-surface);
    }

    .header-buttons {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-ghost {
      background: var(--md-sys-color-surface-container-low);
      color: var(--md-sys-color-on-surface);
      padding: 8px 18px;
      border-radius: 100px;
      border: none;
      box-shadow: none; /* Elevation 0 */
      font-size: 14px;
    }

    .btn-ghost:hover {
      box-shadow: var(--md-elevation-2);
    }

    .btn-primary {
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      padding: 8px 20px;
      border-radius: 100px;
      border: none;
      box-shadow: var(--md-elevation-2);
      font-size: 14px;
    }

    .btn-primary:hover {
      box-shadow: var(--md-elevation-4);
      filter: brightness(1.05);
    }

    /* 3. MIDDLE SECTION SPECIFICATIONS */
    .chat-canvas {
      flex: 1;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end; /* pushing the model selector to the bottom */
      overflow-y: auto;
      position: relative;
    }

    .chat-canvas::-webkit-scrollbar {
      width: 4px;
    }
    .chat-canvas::-webkit-scrollbar-thumb {
      background-color: var(--md-sys-color-surface-container-highest);
      border-radius: 4px;
    }

    .messages-container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: auto; /* Push to top if there are messages */
    }

    .message {
      padding: 16px 20px;
      border-radius: 24px;
      max-width: 85%;
      font-size: 16px;
      line-height: 1.5;
    }

    .message.user {
      align-self: flex-end;
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      align-self: flex-start;
      background: var(--md-sys-color-surface-container-highest);
      color: var(--md-sys-color-on-surface);
      border-bottom-left-radius: 4px;
    }

    .model-selector {
      margin-bottom: 16px;
      align-self: center;
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
      font-size: 14px;
      font-weight: 500;
      padding: 6px 16px;
      border-radius: 100px;
      box-shadow: var(--md-elevation-1);
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .model-selector:hover {
      background: var(--md-sys-color-surface-container-highest);
      box-shadow: var(--md-elevation-2);
    }

    /* 4. BOTTOM INPUT AREA SPECIFICATIONS */
    .input-area {
      padding: 0 32px 28px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .input-bar-container {
      width: 100%;
      max-width: 800px;
      background: var(--md-sys-color-surface-container-high);
      border-radius: 100px;
      padding: 4px 4px 4px 20px;
      box-shadow: var(--md-elevation-4);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: box-shadow 0.2s ease;
    }

    .input-bar-container.focused {
      box-shadow: 0 0 0 2px var(--md-sys-color-primary), var(--md-elevation-4);
    }

    .text-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 16px;
      padding: 12px 0;
      color: var(--md-sys-color-on-surface);
      font-family: inherit;
      resize: none;
      min-height: 24px;
      max-height: 200px;
    }

    .text-input::placeholder {
      color: var(--md-sys-color-on-surface-variant);
    }

    .action-icons {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-attachment {
      background: transparent;
      color: var(--md-sys-color-on-surface-variant);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
    }

    .btn-attachment:hover {
      background: var(--md-sys-color-surface-container-highest);
      color: var(--md-sys-color-on-surface);
    }

    .btn-send {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border: none;
      box-shadow: var(--md-elevation-1);
    }

    .btn-send:disabled {
      background: var(--md-sys-color-surface-container-highest);
      color: var(--md-sys-color-on-surface-variant);
      box-shadow: none;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-send:not(:disabled):hover {
      transform: scale(1.05);
      box-shadow: var(--md-elevation-6);
    }

    .btn-send svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .hint-text {
      color: var(--md-sys-color-on-surface-variant);
      font-size: 13px;
      font-weight: 500;
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }
    
    .hint-text svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    /* 7. RESPONSIVE BEHAVIOR */
    @media (max-width: 767px) {
      .top-bar {
        padding: 0 16px;
      }
      .greeting {
        font-size: 22px;
      }
      .btn-ghost {
        display: none; /* Hide "Get more" text */
      }
      .btn-primary {
        font-size: 12px;
        padding: 6px 14px;
      }
      .chat-canvas {
        padding: 16px;
      }
      .input-area {
        padding: 0 16px 20px 16px;
      }
      .input-bar-container {
        border-radius: 32px;
        padding-left: 16px;
      }
      .btn-send {
        width: 36px;
        height: 36px;
      }
      .btn-attachment {
        width: 36px;
        height: 36px;
      }
    }
  </style>
</head>
<body>

  <!-- 1. Top Bar -->
  <div class="top-bar">
    <div class="greeting">Hello, night owl</div>
    <div class="header-buttons">
      <button class="btn-ghost">Get more with Claude Pro</button>
      <button class="btn-primary">Upgrade to Pro</button>
    </div>
  </div>

  <!-- 2. Middle Section (Chat Canvas) -->
  <div class="chat-canvas" id="chatCanvas">
    <div class="messages-container" id="messagesContainer">
      <!-- Messages will appear here -->
    </div>
    
    <button class="model-selector">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      Sonnet 5 Thinking
    </button>
  </div>

  <!-- 3. Bottom Input Area -->
  <div class="input-area">
    <div class="input-bar-container" id="inputContainer">
      <input type="text" class="text-input" id="textInput" placeholder="Chat with Claude..." autocomplete="off" />
      
      <div class="action-icons">
        <button class="btn-attachment" aria-label="Add attachment">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
        <button class="btn-send" id="sendBtn" disabled aria-label="Send message">
          <svg viewBox="0 0 24 24">
            <path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z" />
          </svg>
        </button>
      </div>
    </div>
    
    <div class="hint-text" id="holdToSpeakBtn">
      <svg viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
      Hold to speak
    </div>
  </div>

  <script>
    const inputContainer = document.getElementById('inputContainer');
    const textInput = document.getElementById('textInput');
    const sendBtn = document.getElementById('sendBtn');
    const messagesContainer = document.getElementById('messagesContainer');
    const chatCanvas = document.getElementById('chatCanvas');

    // Handle focus state on the input
    textInput.addEventListener('focus', () => {
      inputContainer.classList.add('focused');
    });
    
    textInput.addEventListener('blur', () => {
      inputContainer.classList.remove('focused');
    });

    // Enable/disable send button
    textInput.addEventListener('input', (e) => {
      sendBtn.disabled = e.target.value.trim() === '';
    });

    // Simulate send action
    function sendMessage() {
      const text = textInput.value.trim();
      if (!text) return;

      console.log('Sending message:', text);

      // Create user message bubble
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message user';
      msgDiv.textContent = text;
      messagesContainer.appendChild(msgDiv);

      // Clear input
      textInput.value = '';
      sendBtn.disabled = true;

      // Scroll to bottom
      chatCanvas.scrollTop = chatCanvas.scrollHeight;

      // Simulate AI response
      setTimeout(() => {
        const aiDiv = document.createElement('div');
        aiDiv.className = 'message assistant';
        aiDiv.textContent = 'This is a simulated response matching the Claude UI layout constraints.';
        messagesContainer.appendChild(aiDiv);
        chatCanvas.scrollTop = chatCanvas.scrollHeight;
      }, 1000);
    }

    sendBtn.addEventListener('click', sendMessage);
    
    textInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });

    // Handle "Hold to speak" text toggle
    const holdBtn = document.getElementById('holdToSpeakBtn');
    holdBtn.addEventListener('mousedown', () => {
      holdBtn.style.color = 'var(--md-sys-color-primary)';
      textInput.placeholder = "Listening...";
    });
    
    holdBtn.addEventListener('mouseup', () => {
      holdBtn.style.color = 'var(--md-sys-color-on-surface-variant)';
      textInput.placeholder = "Chat with Claude...";
    });
    
    holdBtn.addEventListener('mouseleave', () => {
      holdBtn.style.color = 'var(--md-sys-color-on-surface-variant)';
      textInput.placeholder = "Chat with Claude...";
    });
  </script>
</body>
</html>
