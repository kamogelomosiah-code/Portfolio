<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Chat Interface</title>
  <style>
    :root {
      --md-surface: #f7f7f8;
      --md-surface-low: #f0f0f2;
      --md-surface-high: #e8e8ea;
      --md-surface-highest: #d9d9dc;
      --md-primary: #7c3aed;
      --md-on-primary: #ffffff;
      --md-on-surface: #1a1a1a;
      --md-on-surface-var: #6e6e73;
      --md-elevation-1: 0px 1px 2px rgba(0, 0, 0, 0.05);
      --md-elevation-2: 0px 2px 8px rgba(0, 0, 0, 0.06);
      --md-elevation-4: 0px 4px 20px rgba(0, 0, 0, 0.08);
      --md-glow-ring: 0 0 0 2px rgba(124, 58, 237, 0.3), 0px 4px 20px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--md-surface);
      color: var(--md-on-surface);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 1. TOP BAR */
    .top-bar {
      height: 72px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--md-surface);
      flex-shrink: 0;
    }

    .top-bar-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--md-on-surface);
      letter-spacing: -0.02em;
    }

    .top-bar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-ghost {
      background-color: var(--md-surface-low);
      color: var(--md-on-surface);
      font-size: 14px;
      font-weight: 500;
      padding: 8px 18px;
      border-radius: 100px;
      box-shadow: var(--md-elevation-1);
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.2s cubic-bezier(0.2, 0, 0, 1), background-color 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-ghost:hover {
      transform: scale(1.02);
      box-shadow: var(--md-elevation-2);
      background-color: var(--md-surface-high);
    }

    .btn-primary {
      background-color: var(--md-primary);
      color: var(--md-on-primary);
      font-size: 14px;
      font-weight: 500;
      padding: 8px 20px;
      border-radius: 100px;
      box-shadow: var(--md-elevation-2);
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.2s cubic-bezier(0.2, 0, 0, 1), opacity 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-primary:hover {
      transform: scale(1.02);
      box-shadow: var(--md-elevation-4);
      opacity: 0.95;
    }

    /* 2. CHAT CANVAS */
    .chat-canvas {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
    }

    .messages-container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    .chat-message {
      display: flex;
      flex-direction: column;
      max-width: 80%;
      padding: 12px 20px;
      border-radius: 20px;
      font-size: 15px;
      line-height: 1.5;
    }

    .chat-message.user {
      align-self: flex-end;
      background-color: var(--md-surface-high);
      color: var(--md-on-surface);
      border-bottom-right-radius: 4px;
    }

    .chat-message.assistant {
      align-self: flex-start;
      background-color: var(--md-surface-low);
      color: var(--md-on-surface);
      border-bottom-left-radius: 4px;
    }

    .model-chip {
      background-color: var(--md-surface-high);
      color: var(--md-on-surface);
      font-size: 14px;
      font-weight: 500;
      padding: 6px 16px;
      border-radius: 100px;
      box-shadow: var(--md-elevation-1);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
      user-select: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .model-chip:hover {
      background-color: var(--md-surface-highest);
      box-shadow: var(--md-elevation-2);
      transform: translateY(-1px);
    }

    /* 3. INPUT AREA */
    .input-area {
      padding: 0 32px 28px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    .input-container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .pill-bar {
      width: 100%;
      background-color: #ffffff;
      border-radius: 100px;
      padding: 4px 4px 4px 20px;
      box-shadow: var(--md-elevation-4);
      display: flex;
      align-items: center;
      transition: box-shadow 0.2s ease;
    }

    .pill-bar:focus-within {
      box-shadow: var(--md-glow-ring);
    }

    .chat-input {
      flex: 1;
      background: transparent;
      outline: none;
      font-size: 16px;
      padding: 12px 0;
      color: var(--md-on-surface);
    }

    .chat-input::placeholder {
      color: var(--md-on-surface-var);
    }

    .action-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: transparent;
      color: var(--md-on-surface-var);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 20px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .btn-icon:hover {
      background-color: var(--md-surface-low);
      color: var(--md-on-surface);
    }

    .btn-send {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: var(--md-primary);
      color: var(--md-on-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--md-elevation-2);
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    .btn-send:hover {
      transform: scale(1.05);
      box-shadow: var(--md-elevation-4);
    }

    .btn-send:active {
      transform: scale(0.95);
    }

    .btn-send svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .mic-hint {
      font-size: 13px;
      color: var(--md-on-surface-var);
      text-align: center;
      user-select: none;
    }

    /* RESPONSIVE DESIGN */
    @media (max-width: 768px) {
      .top-bar {
        padding: 0 16px;
      }

      .top-bar-title {
        font-size: 22px;
      }

      .ghost-text {
        display: none;
      }

      .btn-ghost {
        padding: 8px 12px;
      }

      .btn-ghost::after {
        content: "Pro";
      }

      .chat-canvas {
        padding: 16px;
      }

      .input-area {
        padding: 0 16px 20px 16px;
      }

      .pill-bar {
        padding-left: 16px;
      }
    }
  </style>
</head>
<body>

  <!-- 1. TOP BAR -->
  <header class="top-bar">
    <div class="top-bar-title">Hello, night owl</div>
    <div class="top-bar-actions">
      <button class="btn-ghost" type="button">
        <span class="ghost-text">Get more with Claude Pro</span>
      </button>
      <button class="btn-primary" type="button">Upgrade to Pro</button>
    </div>
  </header>

  <!-- 2. CHAT CANVAS -->
  <main class="chat-canvas" id="chatCanvas">
    <div class="messages-container" id="messagesContainer"></div>
    <div class="model-chip" id="modelChip">+ Sonnet 5 Thinking</div>
  </main>

  <!-- 3. INPUT AREA -->
  <footer class="input-area">
    <div class="input-container">
      <form class="pill-bar" id="chatForm" onsubmit="handleSend(event)">
        <input 
          type="text" 
          class="chat-input" 
          id="chatInput" 
          placeholder="Chat with Claude..." 
          autocomplete="off"
        >
        <div class="action-group">
          <button type="button" class="btn-icon" title="Add Attachment" aria-label="Add Attachment">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
          <button type="submit" class="btn-send" title="Send Message" aria-label="Send Message">
            <svg viewBox="0 0 24 24">
              <path d="M12 4l-8 8h5v8h6v-8h5z" />
            </svg>
          </button>
        </div>
      </form>
      <div class="mic-hint">Hold to speak 🎤</div>
    </div>
  </footer>

  <!-- MICRO-INTERACTIONS -->
  <script>
    const chatForm = document.getElementById('chatForm');
    const chatInput = document.getElementById('chatInput');
    const messagesContainer = document.getElementById('messagesContainer');
    const chatCanvas = document.getElementById('chatCanvas');

    function handleSend(event) {
      event.preventDefault();
      const value = chatInput.value.trim();
      if (!value) return;

      console.log("User: " + value);

      // Append user message to chat canvas
      const userMsg = document.createElement('div');
      userMsg.className = 'chat-message user';
      userMsg.textContent = value;
      messagesContainer.appendChild(userMsg);

      // Clear input field
      chatInput.value = '';

      // Auto scroll canvas
      chatCanvas.scrollTop = chatCanvas.scrollHeight;
    }
  </script>
</body>
</html>
