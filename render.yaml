# Render Blueprint: New + > Blueprint, pick this repo.
# The site works with no keys at all (the chat then uses built-in answers).
# Connect MasterAPI (the two MASTERAPI_ lines) to turn on the AI chat, contact mail and a saved profile.
services:
  - type: web
    name: kamo-portfolio
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: APP_URL            # this site's public address, e.g. https://kamo-portfolio.onrender.com
        sync: false
      - key: MASTERAPI_URL      # your MasterAPI address: turns on the AI chat, contact mail, saved profile and the API page
        sync: false
      - key: MASTERAPI_KEY      # an app key created in the MasterAPI console (kept on the server)
        sync: false
      - key: SMTP_HOST          # optional: contact form email
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: ADMIN_PASSCODE     # admin sign-in for the Data page
        sync: false
      - key: SESSION_SECRET     # signs admin sessions
        generateValue: true
